[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "es-reindexador"
version = "0.1.0"
description = "Reindexación de Elasticsearch por lotes, con puntos de control y enriquecimiento."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Graciano" }]
dependencies = ["elasticsearch>=8.12,<9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reindexar = "reindexador.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
